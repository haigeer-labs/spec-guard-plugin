name: Validate

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    # macOS 自带 bash 3.2，Linux 是 bash 5。两者对多字节字符的解析不同，
    # 只跑一个平台会漏掉「$VAR 后紧跟全角括号」这类静默致命 bug。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: bash 版本
        run: /bin/bash --version | head -1

      - name: 仓库完整性校验
        run: /bin/bash scripts/validate.sh

      - name: phase-guard 回归测试
        run: /bin/bash plugins/spec-guard/hooks/test-phase-guard.sh

      - name: verify-artifacts 回归测试
        run: /bin/bash plugins/spec-guard/hooks/test-verify-artifacts.sh

      # 这一步原先结尾是 `|| true` —— 结果永远为 0，**一个永远返回 0 的
      # 校验器和没有校验器没区别**。现在它是真门禁。
      # 版本钉死：本地就是用这一版跑干净的，apt 的版本随发行版漂移，
      # 「我验过」和「CI 跑的」就会是两回事。
      # ⚠️ `shellcheck@4.1.0` 是 **npm 包**的版本，它装的二进制是 shellcheck
      #    **v0.11.0**（`npx shellcheck@4.1.0 -V` 自己会说）。两个号不一样 ——
      #    写 `shellcheck@0.11.0` 会 ETARGET，那个版本在 npm 上根本不存在。
      - name: ShellCheck（阻塞；npm 4.1.0 = 二进制 v0.11.0）
        if: matrix.os == 'ubuntu-latest'
        # evals/*.sh 此前不在范围里 —— 它们是会真的调模型的脚本，更该被检查
        run: npx --yes shellcheck@4.1.0 -S warning plugins/spec-guard/hooks/*.sh scripts/*.sh evals/*.sh
